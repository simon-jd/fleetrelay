name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test and race detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...

  contract:
    name: Protobuf contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: buf format --diff --exit-code
      - run: buf lint
      - run: buf build
      - run: buf generate
      - run: git diff --exit-code -- gen
      - if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'

  web:
    name: Operator console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/docker-compose.yml config --quiet
      - name: Validate observability JSON
        run: |
          python3 -m json.tool deploy/observability/grafana/dashboards/fleet-overview.json >/dev/null
          python3 -m json.tool deploy/observability/grafana/dashboards/command-delivery.json >/dev/null
          python3 -m json.tool deploy/observability/grafana/dashboards/connection-health.json >/dev/null
          python3 -m json.tool deploy/observability/grafana/dashboards/failure-injection.json >/dev/null

  images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [go, contract, web, compose]
    strategy:
      fail-fast: false
      matrix:
        service: [control-api, stream-gateway, dispatcher, device-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/go-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  web-image:
    name: Build console image
    runs-on: ubuntu-latest
    needs: [web, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
