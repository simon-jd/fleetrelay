name: fleetrelay-evidence-lab
x-app: &app
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 1
  mem_limit: 256m
  pids_limit: 128
x-env: &env
  DATABASE_URL: postgres://fleetrelay:lab-only@postgres:5432/fleetrelay?sslmode=disable
  REDIS_ADDR: redis:6379
  INTERNAL_SHARED_TOKEN: lab-internal-only
  DEV_OPERATOR_TOKEN: lab-operator-only
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: fleetrelay
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: fleetrelay
    ports: ["127.0.0.1::5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    cpus: 2
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fleetrelay -d fleetrelay"]
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    ports: ["127.0.0.1::6379"]
    volumes: [redis-data:/data]
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
  migrate:
    image: postgres:17.6-alpine
    environment:
      PGHOST: postgres
      PGUSER: fleetrelay
      PGPASSWORD: lab-only
      PGDATABASE: fleetrelay
    volumes: [../../migrations:/migrations:ro]
    command: [psql, -X, --set, ON_ERROR_STOP=1, --single-transaction, --file, /migrations/apply.sql]
    depends_on:
      postgres: {condition: service_healthy}
  control-api:
    <<: *app
    image: fleetrelay-lab-control-api:${LAB_TAG:-candidate}
    environment:
      <<: *env
      HTTP_ADDR: :8080
    ports: ["127.0.0.1::8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 2s
      timeout: 2s
      retries: 30
  gateway-a: &gateway
    <<: *app
    image: fleetrelay-lab-stream-gateway:${LAB_TAG:-candidate}
    environment: &gateway-env
      <<: *env
      GATEWAY_ID: gateway-a
      HTTP_ADDR: :8081
      GRPC_ADDR: :9090
      CONTROL_API_URL: http://control-api:8080
    depends_on:
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/readyz]
      interval: 2s
      timeout: 2s
      retries: 30
  gateway-b:
    <<: *gateway
    environment:
      <<: *gateway-env
      GATEWAY_ID: gateway-b
  dispatcher:
    <<: *app
    image: ${DISPATCHER_IMAGE:-fleetrelay-lab-dispatcher:candidate}
    environment:
      <<: *env
      METRICS_ADDR: :8082
    ports: ["127.0.0.1::8082"]
    depends_on:
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8082/readyz]
      interval: 2s
      timeout: 2s
      retries: 30
  device-1: &device
    <<: *app
    image: fleetrelay-lab-device-sim:${LAB_TAG:-candidate}
    environment: &device-env
      DEVICE_ID: lab-device-1
      GATEWAY_GRPC_ADDR: gateway-a:9090,gateway-b:9090
      DEVICE_JOURNAL_PATH: /var/lib/fleetrelay/device-1.json
      ADAPTER_DELAY_MS: "25"
    volumes: [device-state:/var/lib/fleetrelay]
    depends_on:
      gateway-a: {condition: service_healthy}
      gateway-b: {condition: service_healthy}
  device-2:
    <<: *device
    environment:
      <<: *device-env
      DEVICE_ID: lab-device-2
      DEVICE_JOURNAL_PATH: /var/lib/fleetrelay/device-2.json
  device-3:
    <<: *device
    environment:
      <<: *device-env
      DEVICE_ID: lab-device-3
      DEVICE_JOURNAL_PATH: /var/lib/fleetrelay/device-3.json
  device-4:
    <<: *device
    environment:
      <<: *device-env
      DEVICE_ID: lab-device-4
      DEVICE_JOURNAL_PATH: /var/lib/fleetrelay/device-4.json
  device-crash:
    <<: *device
    profiles: [fault]
    environment:
      <<: *device-env
      DEVICE_ID: lab-device-crash
      DEVICE_JOURNAL_PATH: /var/lib/fleetrelay/device-crash.json
      SIM_EXIT_AFTER_PERSIST: "true"
  prometheus:
    image: prom/prometheus:v3.6.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=1d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1::9090"]
    cpus: 1
    mem_limit: 256m
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: lab-grafana-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1::3000"]
    cpus: 1
    mem_limit: 256m
volumes:
  postgres-data: {}
  redis-data: {}
  device-state: {}
