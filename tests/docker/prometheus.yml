global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: control-api
    static_configs: [{targets: ['control-api:8080']}]
  - job_name: stream-gateway
    static_configs: [{targets: ['gateway-a:8081', 'gateway-b:8081']}]
  - job_name: dispatcher
    static_configs: [{targets: ['dispatcher:8082']}]
