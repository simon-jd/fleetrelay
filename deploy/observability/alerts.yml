groups:
  - name: fleetrelay-control-plane
    rules:
      - alert: FleetRelayTargetDown
        expr: up{job=~"control-api|stream-gateway|dispatcher"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "FleetRelay target {{ $labels.instance }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.job }} for 30 seconds."
      - alert: FleetRelayOutboxBacklog
        expr: outbox_oldest_unpublished_seconds{job="dispatcher"} > 30
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "FleetRelay outbox has been delayed"
          description: "The oldest unpublished outbox item is {{ $value | humanizeDuration }} old."
      - alert: FleetRelayOutboxRetryWaiting
        expr: fleetrelay_outbox_retry_waiting{job="dispatcher"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "FleetRelay outbox retries remain delayed"
          description: "Inspect Dispatcher logs and pending outbox retry times; do not delete delivery intents."
      - alert: FleetRelayRedisConsumerLag
        expr: redis_consumer_lag > 1000
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Redis Stream consumer lag is high"
          description: "Consumer lag is {{ $value }} events."
      - alert: FleetRelayCommandAckP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(command_end_to_end_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Command ACK p95 exceeds the V1 target"
          description: "Five-minute p95 is {{ $value | humanizeDuration }}."
      - alert: FleetRelayTelemetryDropRateHigh
        expr: sum(rate(telemetry_dropped_total[5m])) / clamp_min(sum(rate(telemetry_received_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of telemetry is being coalesced or dropped"
          description: "Inspect device limits and gateway backpressure."
