global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local-compose

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-api
    metrics_path: /metrics
    static_configs:
      - targets: [control-api:8080]
  - job_name: stream-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway-a:8081, gateway-b:8081]
  - job_name: dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: [dispatcher:8082]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
